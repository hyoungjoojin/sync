<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>

  <body>
    <h2>비밀번호 재설정</h2>
    <p>아래 버튼을 눌러 새 비밀번호를 설정해주세요.</p>

    <div
      style="
        margin: 20px 0;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 6px;
        text-align: center;
      "
    >
      <a
        th:href="${resetUrl}"
        style="
          display: inline-block;
          padding: 12px 24px;
          background: #4f46e5;
          color: #ffffff;
          font-size: 16px;
          font-weight: bold;
          border-radius: 6px;
          text-decoration: none;
        "
        >비밀번호 재설정하기</a
      >
      <p style="font-size: 12px; color: #9ca3af; margin: 16px 0 0 0">
        이 링크는 <span th:text="${expirationMinutes}"></span>분 동안
        유효하며, 한 번만 사용할 수 있습니다.
      </p>
    </div>

    <p style="font-size: 12px; color: #6b7280">
      버튼이 동작하지 않는다면 아래 주소를 브라우저에 붙여넣어주세요.
    </p>
    <p style="font-size: 12px; color: #6b7280; word-break: break-all">
      <span th:text="${resetUrl}"></span>
    </p>

    <p style="color: #9ca3af; font-size: 12px">
      이 요청을 하지 않으셨다면 본 이메일을 무시해주세요. 비밀번호는 변경되지
      않습니다.
    </p>
  </body>
</html>
