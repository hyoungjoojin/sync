services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    env_file: server.env
    expose:
      - "8080"
      - "8081"
    networks:
      - app

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - server
    networks:
      - app

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certbot

networks:
  app:
    driver: bridge
