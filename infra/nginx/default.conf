server {
    listen 80;
    server_name ${DOMAIN_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The agent OAuth2 authorization server and its MCP resource have to live at
    # the origin root, not under /api/: RFC 8414 and RFC 9728 derive the
    # .well-known URLs from the issuer, so an issuer of https://host/api would
    # put discovery at /.well-known/oauth-authorization-server/api — not where a
    # spec-following MCP client looks. Note there is no trailing slash on
    # proxy_pass here, so the path reaches the server unchanged.
    location ~ ^/(oauth2|\.well-known/oauth-(authorization-server|protected-resource))(/|$) {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable HTTP keeps a long-lived SSE response open, so buffering has
    # to be off and the read timeout long enough to outlive an idle session.
    # Keep this comfortably above the MCP access token TTL (currently 24h, see
    # AgentAuthorizationServerConfig) — if they match, the SSE stream and the
    # bearer token backing it can lapse at the same instant.
    location ~ ^/mcp(/|$) {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90000s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
